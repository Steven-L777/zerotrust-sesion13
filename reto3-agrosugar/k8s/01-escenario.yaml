# Namespace donde vive todo el escenario de AgroSugar
apiVersion: v1
kind: Namespace
metadata:
  name: agrosugar
---
# Configuración del broker MQTT (Mosquitto 2 solo escucha en localhost si no se indica listener)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-conf
  namespace: agrosugar
data:
  mosquitto.conf: |
    listener 1883
    # Solo laboratorio. En producción: TLS en 8883 + autenticación
    allow_anonymous true
---
# Broker MQTT: recibe la telemetría de los sensores
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  namespace: agrosugar
spec:
  replicas: 1
  selector:
    matchLabels: { app: mqtt-broker }
  template:
    metadata:
      labels: { app: mqtt-broker }
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2
        ports: [{ containerPort: 1883 }]
        volumeMounts:
        - name: conf
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
      volumes:
      - name: conf
        configMap: { name: mosquitto-conf }
---
# Service para llegar al broker por el nombre mqtt-broker
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  namespace: agrosugar
spec:
  selector: { app: mqtt-broker }
  ports: [{ port: 1883 }]
---
# Base de datos transaccional (el activo que hay que proteger)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-transaccional
  namespace: agrosugar
spec:
  replicas: 1
  selector:
    matchLabels: { app: db-transaccional }
  template:
    metadata:
      labels: { app: db-transaccional }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{ containerPort: 5432 }]
        # La contraseña viene del Secret db-cred (se crea aparte, no va en el YAML)
        envFrom: [{ secretRef: { name: db-cred } }]
---
# Service para llegar a la base de datos por el nombre db-transaccional
apiVersion: v1
kind: Service
metadata:
  name: db-transaccional
  namespace: agrosugar
spec:
  selector: { app: db-transaccional }
  ports: [{ port: 5432 }]
---
# Sensor legítimo: etiqueta role=sensor-node
apiVersion: v1
kind: Pod
metadata:
  name: sensor-hidratacion-01
  namespace: agrosugar
  labels: { role: sensor-node }
spec:
  containers:
  - name: sensor
    image: nicolaka/netshoot
    command: ["sleep", "infinity"]
---
# Pod intruso: etiqueta role=desconocido
apiVersion: v1
kind: Pod
metadata:
  name: intruso
  namespace: agrosugar
  labels: { role: desconocido }
spec:
  containers:
  - name: intruso
    image: nicolaka/netshoot
    command: ["sleep", "infinity"]
